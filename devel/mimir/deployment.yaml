apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:latest
          args: [
            "-config.file=/etc/mimir/config.yaml",
            "-target=all,alertmanager",
          ]
          ports:
            - containerPort: 9009
          volumeMounts:
            - name: config-volume
              mountPath: /etc/mimir
            - name: mimir-data
              mountPath: /tmp/mimir
            - name: alertmanagerconfig-volume
              mountPath: /tmp/mimir/alertmanager-config/
      securityContext:
        fsGroup: 10001
      volumes:
        - name: config-volume
          configMap:
            name: mimir-config
        - name: mimir-data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: alertmanagerconfig-volume
          configMap:
            name: mimir-alertmanager-config
